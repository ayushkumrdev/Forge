<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<style>
  :root {
    --bg: #262624; --bg-deep: #1f1e1b; --surface: #2d2c29; --raise: #363430;
    --line: #3b3936; --line-soft: #343230;
    --ink: #f0eee6; --dim: #b8b2a7; --faint: #837d72;
    --accent: #d97757; --accent-strong: #c15f3c;
    --accent-soft: rgba(217,119,87,.12); --accent-line: rgba(217,119,87,.45);
    --ok: #7cc088; --err: #e5756a; --warn: #d9a441; --info: #8dabcd;
    --serif: "Charter", "Cambria", Georgia, "Times New Roman", serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --r: 14px; --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    display: flex; overflow: hidden; font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: rgba(217,119,87,.28); }

  /* ─── sidebar ─────────────────────────────────────────── */
  aside {
    width: 256px; flex-shrink: 0; background: var(--bg-deep); border-right: 1px solid var(--line-soft);
    display: none; flex-direction: column; padding: 16px 12px 14px;
  }
  aside.on { display: flex; }
  .wordmark { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .2px; padding: 2px 8px 16px; color: var(--ink); }
  .wordmark b { color: var(--accent); margin-right: 8px; }
  .wordmark svg { width: 17px; height: 17px; vertical-align: -3px; }
  #new-chat {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--accent); color: #fff;
    border: 0; border-radius: var(--r-sm); padding: 9px; font-weight: 600; font-size: 13px;
    font-family: var(--body); cursor: pointer; transition: background .15s;
  }
  #new-chat:hover { background: var(--accent-strong); }
  #convos { flex: 1; overflow-y: auto; margin-top: 16px; display: flex; flex-direction: column; gap: 1px; }
  .convo {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 11px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--dim); transition: background .12s, color .12s;
  }
  .convo:hover { background: var(--surface); color: var(--ink); }
  .convo.active { background: var(--accent-soft); color: var(--ink); }
  .convo .ct { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .cx { visibility: hidden; background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 13px; padding: 0 3px; border-radius: 4px; flex-shrink: 0; }
  .convo:hover .cx { visibility: visible; }
  .convo .cx:hover { color: var(--err); }
  .convo .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: fadepulse 1.4s ease-in-out infinite; vertical-align: 1px; }
  @keyframes fadepulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .side-foot { border-top: 1px solid var(--line-soft); padding: 12px 8px 0; margin-top: 10px; font-size: 11.5px; color: var(--faint); line-height: 1.9; }
  .side-foot b { color: var(--dim); font-weight: 500; }

  /* ─── main column ─────────────────────────────────────── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: none; align-items: center; gap: 8px; padding: 10px 18px;
    border-bottom: 1px solid var(--line-soft); background: var(--bg); flex-shrink: 0;
  }
  header.on { display: flex; }
  .chip {
    display: flex; align-items: center; gap: 7px; background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; color: var(--dim); cursor: pointer;
    max-width: 320px; white-space: nowrap; transition: border-color .15s, color .15s, background .15s;
    font-family: var(--body);
  }
  .chip:hover { background: var(--surface); color: var(--ink); }
  .chip .path { overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; font-family: var(--mono); font-size: 11.5px; }
  select.chip { appearance: none; cursor: pointer; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--faint); border: 0; padding: 6px 13px; font-size: 11.5px; font-weight: 600; letter-spacing: .4px; cursor: pointer; font-family: var(--body); transition: background .15s, color .15s; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: var(--body); transition: background .15s, color .15s; }
  .ghost:hover { background: var(--surface); color: var(--ink); }

  /* ─── welcome ─────────────────────────────────────────── */
  #welcome { flex: 1; display: flex; align-items: center; justify-content: center; }
  .hero { width: 600px; animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .hero-mark { font-family: var(--serif); font-size: 40px; font-weight: 600; letter-spacing: -.5px; margin-bottom: 8px; }
  .hero-mark b { color: var(--accent); margin-right: 12px; }
  .hero-mark svg { width: 34px; height: 34px; vertical-align: -3px; }
  .hero-sub { color: var(--dim); font-size: 15px; line-height: 1.6; margin-bottom: 32px; max-width: 480px; }
  .hero-sub em { color: var(--ink); font-style: normal; }
  .panel { background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 26px; }
  .lbl { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin: 0 0 8px 2px; }
  .row { display: flex; gap: 8px; margin-bottom: 18px; }
  .row input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
    color: var(--ink); padding: 11px 13px; font-family: var(--mono); font-size: 12.5px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .row input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: var(--r-sm);
    padding: 11px 17px; cursor: pointer; font-size: 13px; font-family: var(--body); transition: background .15s;
  }
  .btn:hover { background: var(--raise); }
  #recent { display: flex; flex-wrap: wrap; gap: 6px; margin: -10px 0 18px; }
  #recent .chip { max-width: 100%; }
  .hero select { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: var(--r-sm); padding: 11px 13px; font-family: var(--mono); font-size: 12.5px; margin-bottom: 18px; outline: none; }
  .go {
    width: 100%; padding: 12px; border: 0; border-radius: var(--r-sm); cursor: pointer;
    background: var(--accent); color: #fff;
    font-weight: 600; font-size: 14px; font-family: var(--body); transition: background .15s;
  }
  .go:hover { background: var(--accent-strong); }
  .go:disabled { opacity: .5; }
  #w-err { color: var(--err); font-size: 12.5px; margin-top: 10px; min-height: 17px; }

  /* ─── thread ──────────────────────────────────────────── */
  /* No scroll-behavior here: following new output must be instant. An
     animated auto-scroll fires scroll events at intermediate positions,
     which the pinning logic reads as "the user scrolled away". */
  #thread { flex: 1; overflow-y: auto; display: none; }
  #thread.on { display: block; }
  .lane { max-width: 760px; margin: 0 auto; padding: 30px 26px 10px; }
  .m { margin-bottom: 26px; animation: rise .22s ease both; }
  .m-user { display: flex; justify-content: flex-end; }
  .m-user .bub {
    background: var(--surface); border-radius: 16px;
    padding: 11px 16px; max-width: 78%; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .m-forge .tag { font-family: var(--serif); font-size: 13px; color: var(--ink); margin-bottom: 8px; }
  .m-forge .tag svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 7px; color: var(--accent); }
  .m-forge .body { line-height: 1.7; word-break: break-word; color: var(--ink); }
  .m-forge .body > :first-child { margin-top: 0; }
  .m-forge .body > :last-child { margin-bottom: 0; }
  .body p { margin: 0 0 12px; }
  .body h3, .body h4, .body h5, .body h6 {
    font-family: var(--serif); font-weight: 600; line-height: 1.35;
    margin: 20px 0 8px; color: var(--ink);
  }
  .body h3 { font-size: 17px; }
  .body h4 { font-size: 15.5px; }
  .body h5, .body h6 { font-size: 14.5px; }
  .body ul, .body ol { margin: 0 0 12px; padding-left: 22px; }
  .body li { margin: 5px 0; padding-left: 3px; }
  .body li::marker { color: var(--faint); }
  .body ul ul, .body ol ol { margin-bottom: 0; }
  .body blockquote {
    margin: 0 0 12px; padding: 2px 0 2px 14px;
    border-left: 2px solid var(--line); color: var(--dim);
  }
  .body hr { border: 0; border-top: 1px solid var(--line-soft); margin: 18px 0; }
  .body strong { font-weight: 650; color: var(--ink); }
  .body em { font-style: italic; }
  .body del { opacity: .6; }
  .body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .body a:hover { color: var(--accent-strong); }
  .body table { border-collapse: collapse; margin: 0 0 12px; font-size: 13.5px; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .m-forge.err .body { color: #e8aca5; border-left: 2px solid var(--err); padding-left: 13px; }
  .m-forge.cmd .body { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 13px 15px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: fadepulse .9s infinite; border-radius: 1px; }

  /* code blocks */
  .code { background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: var(--r-sm); margin: 12px 0; overflow: hidden; }
  .code-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 13px; border-bottom: 1px solid var(--line-soft); font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .8px; }
  .code-bar button { background: none; border: 0; color: var(--faint); cursor: pointer; font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .4px; }
  .code-bar button:hover { color: var(--ink); }
  .code pre { padding: 13px 15px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
  .body code:not(pre code) { font-family: var(--mono); font-size: 12.5px; background: var(--surface); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
  .k { color: #d99777; } .s { color: #a5c28b; } .c { color: #837d72; font-style: italic; } .n { color: #8dabcd; }

  /* tool cards */
  .tools { margin: -12px 0 24px; display: flex; flex-direction: column; gap: 4px; }
  .tcard { border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: var(--bg-deep); overflow: hidden; animation: rise .18s ease both; }
  .tcard summary {
    list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 13px; cursor: pointer;
    font-family: var(--mono); font-size: 11.5px; color: var(--dim); user-select: none;
  }
  .tcard summary::-webkit-details-marker { display: none; }
  .tcard summary:hover { background: var(--surface); }
  .tcard .glyph { color: var(--accent); width: 14px; text-align: center; }
  .tcard .tname { color: var(--ink); font-weight: 600; }
  .tcard .targ { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); }
  .tcard .st-ok { color: var(--ok); } .tcard .st-err { color: var(--err); }
  .tcard .tbody { border-top: 1px solid var(--line-soft); padding: 11px 13px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto; background: var(--bg); }
  .tbody .sect { color: var(--faint); letter-spacing: 1px; text-transform: uppercase; font-size: 9.5px; margin: 7px 0 3px; }
  .tcard .chev { color: var(--faint); font-size: 12px; transition: transform .15s ease; }
  .tcard[open] .chev { transform: rotate(180deg); }
  .tbody .dline { white-space: pre-wrap; word-break: break-all; padding: 1px 6px; border-radius: 4px; }
  .tbody .dline.da { color: #a5c28b; background: rgba(165,194,139,.08); }
  .tbody .dline.dd { color: #e5978d; background: rgba(229,117,106,.08); }
  .tbody .dline.dmute { color: var(--faint); }

  /* working indicator */
  #working { display: none; align-items: center; gap: 10px; padding: 4px 0 24px; font-size: 13px; color: var(--dim); }
  #working.on { display: flex; }
  .flame { width: 16px; height: 16px; color: var(--accent); }
  .flame svg { width: 100%; height: 100%; display: block; animation: think 1.6s ease-in-out infinite; }
  @keyframes think { 0%, 100% { transform: rotate(0deg) scale(1); opacity: 1; } 50% { transform: rotate(180deg) scale(.78); opacity: .4; } }
  #live-msg .tag svg { animation: think 1.6s ease-in-out infinite; }
  #queued-note { color: var(--warn); }

  /* ─── composer ────────────────────────────────────────── */
  #composer { display: none; flex-shrink: 0; padding: 8px 26px 20px; }
  #composer.on { display: block; }
  .comp-shell { max-width: 760px; margin: 0 auto; }
  .comp-box {
    display: flex; flex-direction: column; gap: 8px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 10px 16px;
    transition: border-color .15s;
  }
  .comp-box:focus-within { border-color: var(--accent-line); }
  #input { width: 100%; background: none; border: 0; outline: none; color: var(--ink); font-family: var(--body); font-size: 14.5px; resize: none; max-height: 190px; line-height: 1.55; padding: 2px 4px 0; }
  #input::placeholder { color: var(--faint); }
  .comp-controls { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 50%;
    width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 16px; cursor: pointer; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--raise); color: var(--ink); }
  .pill {
    border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 15px;
    padding: 5px 13px; font-size: 12px; font-family: var(--body); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .pill:hover { background: var(--raise); color: var(--ink); }
  .pill.auto { border-color: var(--accent-line); color: var(--accent); }
  .mini-seg { display: flex; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; }
  .mini-seg button { background: none; border: 0; color: var(--faint); padding: 5px 11px; font-size: 12px; font-family: var(--body); cursor: pointer; transition: background .15s, color .15s; }
  .mini-seg button:hover { color: var(--ink); }
  .mini-seg button.on { background: var(--accent-soft); color: var(--accent); }
  #attach-chips { display: none; flex-wrap: wrap; gap: 6px; }
  #attach-chips.on { display: flex; }
  .a-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-deep); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
  .a-chip button { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 12px; padding: 0; }
  .a-chip button:hover { color: var(--err); }
  #send {
    border: 0; border-radius: 50%; width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; transition: background .15s;
  }
  #send:hover { background: var(--accent-strong); }
  #send:disabled { opacity: .35; cursor: default; }
  #stop { display: none; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 15px; padding: 5px 13px; font-size: 12px; font-family: var(--body); cursor: pointer; }
  #stop:hover { border-color: var(--err); color: var(--err); }
  #stop.on { display: block; }
  #jump {
    display: none; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 108px; z-index: 20; background: var(--raise); color: var(--ink);
    border: 1px solid var(--line); border-radius: 16px; padding: 6px 15px;
    font-size: 12.5px; font-family: var(--body); cursor: pointer;
    box-shadow: 0 6px 20px -8px rgba(0,0,0,.7);
  }
  #jump.on { display: block; }
  #jump:hover { background: var(--surface); }
  main { position: relative; }
  .m-forge .tag { position: relative; }
  .copy-reply {
    background: none; border: 0; color: var(--faint); cursor: pointer;
    font-size: 11.5px; font-family: var(--body); padding: 2px 6px;
    border-radius: 5px; margin-left: 8px; opacity: 0; transition: opacity .15s;
  }
  .m-forge:hover .copy-reply { opacity: 1; }
  .copy-reply:hover { color: var(--ink); background: var(--surface); }
  .self-correct {
    font-size: 12.5px; color: var(--warn); margin: -8px 0 16px;
    padding-left: 13px; border-left: 2px solid rgba(217,164,65,.4);
  }
  /* one requirement of a multi-part request, run on its own */
  .step-mark {
    font-size: 12.5px; color: var(--ink-dim); margin: 2px 0 12px;
    padding-left: 13px; border-left: 2px solid var(--accent);
  }
  /* reasoning / chain of thought */
  .think {
    border: 1px solid var(--line-soft); border-radius: var(--r-sm);
    background: var(--bg-deep); margin: 0 0 14px; overflow: hidden;
  }
  .think summary {
    list-style: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 13px; cursor: pointer; font-size: 12.5px; color: var(--dim);
    user-select: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary:hover { background: var(--surface); color: var(--ink); }
  .think summary svg { width: 13px; height: 13px; color: var(--accent); flex-shrink: 0; }
  .think summary .chev { margin-left: auto; color: var(--faint); font-size: 12px; transition: transform .15s; }
  .think[open] .chev { transform: rotate(180deg); }
  .think-body {
    border-top: 1px solid var(--line-soft); padding: 12px 15px;
    color: var(--dim); font-size: 13.5px; line-height: 1.65;
  }
  .think-body p { margin: 0 0 8px; }
  .think-body > :last-child { margin-bottom: 0; }

  /* ─── modals ──────────────────────────────────────────── */
  .veil { position: fixed; inset: 0; background: rgba(20,19,17,.72); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; }
  .veil.on { display: flex; }
  .modal { background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 26px; width: 580px; max-height: 82vh; display: flex; flex-direction: column; animation: pop .16s ease both; box-shadow: 0 24px 70px -24px rgba(0,0,0,.8); }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .modal.warn { border-top: 2px solid var(--accent); }
  .modal h2 { font-family: var(--serif); font-size: 16px; margin-bottom: 14px; font-weight: 600; }
  .modal h2 .tool-name { font-family: var(--mono); font-size: 13.5px; color: var(--accent); }
  .modal .det { font-family: var(--mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 18px; word-break: break-all; max-height: 200px; overflow-y: auto; color: var(--dim); }
  .modal .acts { display: flex; gap: 9px; justify-content: flex-end; }
  .modal .acts button { border-radius: 9px; padding: 8px 17px; cursor: pointer; font-size: 13px; font-family: var(--body); background: var(--surface); border: 1px solid var(--line); color: var(--ink); transition: background .15s; }
  .modal .acts button:hover { background: var(--raise); }
  .modal .acts .deny { border-color: transparent; color: var(--err); background: none; }
  .modal .acts .allow { background: var(--accent); border: 0; color: #fff; font-weight: 600; }
  .modal .acts .allow:hover { background: var(--accent-strong); }
  .modal pre { font-family: var(--mono); font-size: 11.5px; overflow: auto; background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 13px; line-height: 1.65; }
  .da { color: #a5c28b; } .dd { color: #e5978d; } .dm { color: var(--info); }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="wordmark"><b><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c1.3 6 4.5 9.2 10.5 10.5-6 1.3-9.2 4.5-10.5 10.5C10.7 16.5 7.5 13.3 1.5 12 7.5 10.7 10.7 7.5 12 1.5Z"/></svg></b>Forge</div>
  <button id="new-chat" onclick="newChat()">New chat</button>
  <div id="convos"></div>
  <div class="side-foot">
    <div><b id="u-model">–</b></div>

<script>
"use strict";
const LOGO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c1.3 6 4.5 9.2 10.5 10.5-6 1.3-9.2 4.5-10.5 10.5C10.7 16.5 7.5 13.3 1.5 12 7.5 10.7 10.7 7.5 12 1.5Z"/></svg>';
const $ = (s) => document.querySelector(s);
const esc = (t) => (t ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = { active:false, status:"idle", msgSeen:0, evtSeen:0, timer:null, workStart:0, wMode:"ask", wEffort:"smart", pollGen:0, sessionId:null, mode:"ask", attachments:[], pinned:true };

async function api(path, body) {
  const opts = body !== undefined
    ? { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) } : {};
  const res = await fetch("/api" + path, opts);
  if (!res.ok) { let d; try { d = JSON.parse(await res.text()).detail; } catch(e){} throw new Error(d || res.statusText); }
  return res.json();
}

/* ── markdown + tiny highlighter ─────────────────────────── */
const KW = /\b(def|class|return|import|from|if|elif|else|for|while|try|except|finally|with|as|lambda|pass|raise|yield|async|await|const|let|var|function|export|default|new|typeof|interface|type|public|private|struct|enum|match|fn|pub|use|void|int|str|bool|float|None|null|undefined|true|false|True|False|self|this)\b/g;
function hl(code) {
  return esc(code)
    .replace(/(&quot;.*?&quot;|'[^'\n]*'|`[^`\n]*`)/g, '<span class="s">$1</span>')
    .replace(/(#[^\n]*|\/\/[^\n]*)/g, '<span class="c">$1</span>')
    .replace(KW, '<span class="k">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="n">$1</span>');
}
/* inline spans: code, bold, italic, links, strikethrough */
function mdInline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
    .replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noreferrer">$1</a>'
    );
}

const _BULLET = /^\s*[-*+]\s+/;
const _NUMBER = /^\s*\d+[.)]\s+/;
const _HEADING = /^\s{0,3}(#{1,6})\s+(.*)$/;
const _QUOTE = /^\s*>\s?/;
const _RULE = /^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/;

function _isBlockStart(line) {
  return (
    _BULLET.test(line) || _NUMBER.test(line) || _HEADING.test(line) ||
    _QUOTE.test(line) || _RULE.test(line)
  );
}

/* Block-level markdown: paragraphs, lists, headings, quotes, rules.
   Without this every list and paragraph collapsed into one run-on line,
   because a bullet was rewritten to "• text" with no block element. */
function mdBlocks(text) {
  const lines = text.split("\n");
  let html = "";
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const heading = _HEADING.exec(line);
    if (heading) {
      const level = Math.min(heading[1].length + 2, 6);
      html += `<h${level}>${mdInline(heading[2])}</h${level}>`;
      i++; continue;
    }
    if (_RULE.test(line)) { html += "<hr>"; i++; continue; }

    if (_BULLET.test(line) || _NUMBER.test(line)) {
      const ordered = !_BULLET.test(line) && _NUMBER.test(line);
      const marker = ordered ? _NUMBER : _BULLET;
      const items = [];
      while (i < lines.length && marker.test(lines[i])) {
        let item = lines[i].replace(marker, "");
        i++;
        // continuation lines belong to the item they follow
        while (i < lines.length && lines[i].trim() && !_isBlockStart(lines[i])) {
          item += "\n" + lines[i].trim();
          i++;
        }
        items.push(item);
      }
      const tag = ordered ? "ol" : "ul";
      html += `<${tag}>` +
        items.map(t => `<li>${mdInline(t).replace(/\n/g, "<br>")}</li>`).join("") +
        `</${tag}>`;
      continue;
    }

    if (_QUOTE.test(line)) {
      const quoted = [];
      while (i < lines.length && _QUOTE.test(lines[i])) {
        quoted.push(lines[i].replace(_QUOTE, "")); i++;
      }
      html += `<blockquote>${mdInline(quoted.join("\n")).replace(/\n/g, "<br>")}</blockquote>`;
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() && !_isBlockStart(lines[i])) {
      para.push(lines[i]); i++;
    }
    html += `<p>${mdInline(para.join("\n")).replace(/\n/g, "<br>")}</p>`;
  }
  return html;
}

function md(text) {
  // split on ``` fences: single capture group => array alternates
  // [content, cap, content, cap, ...]. Content lives at even indices; every
  // OTHER content block (indices 2,6,10 => (i/2) odd) is a fenced code block,
  // whose language is the preceding capture parts[i-1].
  const parts = String(text).split(/```(\w*)\n?/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) continue; // capture groups handled alongside their code
    if ((i / 2) % 2 === 1) {   // fenced code block
      const lang = parts[i - 1] || "code";
      const id = "cb" + Math.random().toString(36).slice(2, 8);
      html += `<div class="code"><div class="code-bar"><span>${esc(lang)}</span>`
        + `<button onclick="copyCode('${id}', this)">Copy</button></div>`
        + `<pre><code id="${id}">${hl(parts[i].replace(/\n$/, ""))}</code></pre></div>`;
    } else {
      html += mdBlocks(parts[i]);
    }
  }
  return html;
}
function copyCode(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent;
  const flash = () => {
    if (!btn) return;
    const original = btn.textContent;
    btn.textContent = "✓ COPIED";
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash, () => fallbackCopy(text, flash));
  } else { fallbackCopy(text, flash); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ── folder handling ─────────────────────────────────────── */
async function pickFolder() {
  if (window.pywebview?.api?.pick_folder) {

}
async function loadRecent() {

    const recent = await api("/chat/recent");
    $("#recent").innerHTML = recent.map(p =>
      `<div class="chip" onclick="document.getElementById('w-folder').value='${esc(p).replace(/\\/g,"\\\\")}'"><span class="path">${esc(p)}</span></div>`).join("");
  } catch (e) {}
}
async function loadModels(selectId, chosen) {
  try {
    const models = await api("/models");
    $("#" + selectId).innerHTML =
      models.map(m => `<option ${m === chosen ? "selected" : ""}>${esc(m)}</option>`).join("")
      || "<option value=''>(no models — is Ollama running?)</option>";

}
function syncEffortUI(level) {
  S.wEffort = level;
  for (const l of ["fast", "smart", "genius"])
    $("#c-" + l).classList.toggle("on", l === level);
}
async function setEffort(level) {
  try { const st = await api("/chat/effort", { effort: level }); syncEffortUI(st.effort); }
  catch (e) {}
}
function updateModeUI(mode) {
  S.mode = mode;
  const pill = $("#c-mode");
  pill.textContent = mode === "auto" ? "Auto" : "Ask first";
  pill.classList.toggle("auto", mode === "auto");
}
async function toggleMode() {
  try {
    const st = await api("/chat/mode", { mode: S.mode === "ask" ? "auto" : "ask" });
    updateModeUI(st.mode);
  } catch (e) {}
}

/* ── image attachments ───────────────────────────────────── */
function pickImages() { $("#file-in").click(); }
$("#file-in").addEventListener("change", async (ev) => {
  for (const file of ev.target.files) {
    try {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const r = await api("/chat/attach", { filename: file.name, data_b64: data });
      S.attachments.push(r.path);
    } catch (e) { addForge("Could not attach " + file.name + ": " + e.message, "error"); }
  }
  ev.target.value = "";
  renderAttachChips();
});
function renderAttachChips() {
  const box = $("#attach-chips");
  box.classList.toggle("on", S.attachments.length > 0);
  box.innerHTML = S.attachments.map((p, i) =>
    `<span class="a-chip">▣ ${esc(p.split("/").pop())}<button title="Remove" onclick="S.attachments.splice(${i},1);renderAttachChips()">✕</button></span>`
  ).join("");
}

/* ── session lifecycle ───────────────────────────────────── */
async function startSession() {
  $("#w-err").textContent = ""; $("#w-go").disabled = true;
  try {
    const st = await api("/chat/start", {
      workspace: $("#w-folder").value.trim() || null,
      model: $("#w-model").value || null, mode: S.wMode, effort: S.wEffort,
    });
    enterChat(st);
  } catch (e) { $("#w-err").textContent = e.message; }
  finally { $("#w-go").disabled = false; }
}
async function newChat() {
  const st = await api("/chat/start", { workspace: $("#h-folder").textContent, model: $("#h-model").value || null, mode: S.mode, effort: S.wEffort });
  enterChat(st);
}
function enterChat(st) {
  S.active = true; S.msgSeen = 0; S.evtSeen = 0; S.status = "idle"; S.pollGen++;
  S.sessionId = st.session_id; S.attachments = []; S.pinned = true;
  renderAttachChips();
  $("#jump").classList.remove("on");
  $("#welcome").style.display = "none";
  $("#sidebar").classList.add("on");
  $("#topbar").classList.add("on");
  $("#thread").classList.add("on");
  $("#composer").classList.add("on");
  $("#lane").innerHTML = "";
  $("#h-folder").textContent = st.workspace;
  updateModeUI(st.mode || "ask");
  syncEffortUI(st.effort || "smart");
  loadModels("h-model", st.model);
  refreshSessions();
  $("#input").focus();
  poll(S.pollGen, true);
}
function goWelcome() {
  S.active = false; S.pollGen++;
  clearTimeout(S.timer);
  ["sidebar","topbar","thread","composer"].forEach(id => $("#" + id).classList.remove("on"));
  $("#welcome").style.display = "flex";
  loadRecent();
}
async function refreshSessions() {
  try {
    const sessions = await api("/chat/sessions");
    $("#convos").innerHTML = sessions.map(s => `
      <div class="convo ${s.current ? "active" : ""}" onclick="selectSession('${s.session_id}')">
        ${s.status === "working" ? '<span class="dot"></span>' : ""}<span class="ct">${esc(s.title)}</span>
        <button class="cx" title="Delete conversation" onclick="deleteConvo('${s.session_id}', event)">✕</button>
      </div>`).join("");
  } catch (e) {}
}
async function selectSession(id) {
  try {
    const st = await api("/chat/select", { session_id: id });
    enterChat(st);
  } catch (e) { refreshSessions(); }
}
async function deleteConvo(id, ev) {
  ev.stopPropagation();
  try {
    const r = await api("/chat/delete", { session_id: id });
    if (id === S.sessionId) {
      if (r.current) selectSession(r.current); else goWelcome();
    } else refreshSessions();
  } catch (e) {}
}

/* ── messaging ───────────────────────────────────────────── */
async function sendMessage() {
  let text = $("#input").value.trim();
  if (!text && !S.attachments.length) return;
  if (S.attachments.length) {
    const mentions = S.attachments.map(p => "@" + p).join(" ");
    text = text ? mentions + "\n" + text : mentions + " — describe what you see.";
    S.attachments = [];
    renderAttachChips();
  }
  $("#input").value = ""; autosize();
  try { await api("/chat/message", { text }); }
  catch (e) { addForge(e.message, "error"); }
  poll(S.pollGen, true);
}
async function stopTurn() { try { await api("/chat/stop", {}); } catch (e) {} }

function addUser(text) {
  $("#lane").insertAdjacentHTML("beforeend",
    `<div class="m m-user"><div class="bub">${esc(text)}</div></div>`);
}
/* Reasoning models (deepseek-r1 and friends) wrap their chain of thought in
   <think> tags. Pull it out of the answer and show it as collapsed reasoning
   instead of dumping raw tags into the reply. */
const _THINK_RE = /<think>([\s\S]*?)(?:<\/think>|$)/gi;
function thinkingCard(text, label, open) {
  return `<details class="think"${open ? " open" : ""}><summary>${LOGO}`
    + `<span>${esc(label || "Thought process")}</span>`
    + `<span class="chev">⌄</span></summary><div class="think-body">${md(text)}</div></details>`;
}
function renderReply(text) {
  const thoughts = [];
  const body = String(text).replace(_THINK_RE, (_m, inner) => {
    if (inner.trim()) thoughts.push(inner.trim());
    return "";
  });
  return (thoughts.length ? thinkingCard(thoughts.join("\n\n")) : "") + md(body);
}

function addForge(text, kind) {
  const cls = kind === "error" ? "err" : kind === "command" ? "cmd" : "";
  const body = kind === "error" || kind === "command" ? md(text) : renderReply(text);
  const id = "r" + Math.random().toString(36).slice(2, 8);
  window._replies = window._replies || {};
  window._replies[id] = text;
  $("#lane").insertAdjacentHTML("beforeend",
    `<div class="m m-forge ${cls}"><div class="tag">${LOGO}Forge`
    + `<button class="copy-reply" onclick="copyReply('${id}', this)">Copy</button></div>`
    + `<div class="body">${body}</div></div>`);
}
function copyReply(id, btn) {
  const text = (window._replies || {})[id];
  if (text === undefined) return;
  const flash = () => {
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = "Copy"; }, 1200);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(flash, () => fallbackCopy(text, flash));
  } else fallbackCopy(text, flash);
}

const GLYPHS = {
  read_file:"◇", write_file:"✎", edit_file:"✎", append_to_file:"✚",
  delete_file:"✕", list_dir:"▤",
  run_command:"❯", run_powershell:"❯", grep:"⌕", find_files:"⌕", search_code:"◈",
  read_image:"▣",
  find_symbol:"ƒ", who_imports:"⇄", git:"⎇", fetch_url:"↗", web_search:"⌕",
  github_repo:"⬡", github_file:"⬡",
};
function primaryArg(a) { return a?.path || a?.command || a?.pattern || a?.query || a?.name || a?.glob || a?.args || JSON.stringify(a || {}); }

function currentToolBox() {
  const lane = $("#lane");
  const real = [...lane.children].filter(el => el.id !== "working" && el.id !== "live-msg");
  let box = real[real.length - 1];
  if (!box || !box.classList.contains("tools")) {
    box = document.createElement("div"); box.className = "tools"; lane.appendChild(box);
  }
  return box;
}
function lastPendingCard() {
  const cards = document.querySelectorAll("#lane .tcard");
  for (let i = cards.length - 1; i >= 0; i--) {
    if (cards[i].querySelector(".tstat")) return cards[i];
  }
  return null;
}
const FILE_VERBS = { write_file: "Created", edit_file: "Edited",
                     append_to_file: "Added to", delete_file: "Deleted" };
// the thread should read as a narrative of actions, not a log of function names
const TOOL_VERBS = {
  ...FILE_VERBS,
  read_file: "Read", list_dir: "Listed", run_command: "Ran",
  run_powershell: "Ran", grep: "Searched for", find_files: "Found files",
  search_code: "Searched the code for", find_symbol: "Looked up",
  who_imports: "Checked what imports", git: "git",
  web_search: "Searched the web for", fetch_url: "Fetched",
  github_repo: "Analyzed", github_file: "Read from GitHub",
  read_image: "Looked at",
};
function diffLines(text, sign, cls, cap = 30) {
  const lines = String(text ?? "").replace(/\n$/, "").split("\n");
  let html = lines.slice(0, cap)
    .map(l => `<div class="dline ${cls}">${sign} ${esc(l)}</div>`).join("");
  if (lines.length > cap) html += `<div class="dline dmute">… ${lines.length - cap} more lines</div>`;
  return html;
}
function fileOpBody(e) {
  const a = e.arguments || {};
  if (e.tool === "edit_file")
    return diffLines(a.old_string, "-", "dd") + diffLines(a.new_string, "+", "da");
  if (e.tool === "write_file" || e.tool === "append_to_file")
    return diffLines(a.content, "+", "da");
  return `<div class="dline dd">- ${esc(a.path || "")}</div>`;
}
const GATE_LABEL = {
  pasted_code: "caught itself pasting code instead of editing the file",
  promised_action: "caught itself describing the change instead of making it",
  false_verification: "caught itself claiming checks it never ran",
};
function addToolEvents(events) {
  for (const e of events) {
    if (e.kind === "intent_brief") {
      // the reasoning model's read of the request, before any action
      $("#lane").insertAdjacentHTML("beforeend",
        `<div class="m m-forge">${thinkingCard(e.output || "", "Working out what you want")}</div>`);
      continue;
    }
    if (e.kind === "plan_first") {
      // multi-part requests are executed one requirement at a time; show the
      // plan, otherwise the steps below read as unexplained tool calls
      const steps = String(e.output || "").split(";").map(s => s.trim()).filter(Boolean);
      const n = e.count || steps.length;
      $("#lane").insertAdjacentHTML("beforeend",
        `<div class="m m-forge">${thinkingCard(
          steps.map((s, i) => `${i + 1}. ${s}`).join("\n"),
          `Working through this in ${n} step${n === 1 ? "" : "s"}`, true)}</div>`);
      continue;
    }
    if (e.kind === "focused_pass") {
      $("#lane").insertAdjacentHTML("beforeend",
        `<div class="step-mark">${esc(e.output || "")}</div>`);
      continue;
    }
    if (e.kind === "honesty_violation") {
      if (!e.corrected) continue;  // only show the gate when it actually acted
      $("#lane").insertAdjacentHTML("beforeend",
        `<div class="self-correct">Forge ${esc(GATE_LABEL[e.gate] || "corrected itself")} — retrying.</div>`);
      continue;
    }
    if (e.kind === "tool_call") {
      const card = document.createElement("details"); card.className = "tcard";
      const verb = TOOL_VERBS[e.tool];
      const subject = FILE_VERBS[e.tool]
        ? (e.arguments || {}).path || ""
        : String(primaryArg(e.arguments));
      const head = `<span class="tname">${esc(verb || e.tool)}</span>`
        + `<span class="targ">${esc(subject)}</span>`;
      const body = verb
        ? fileOpBody(e)
        : `<div class="sect">arguments</div>${esc(JSON.stringify(e.arguments || {}, null, 1))}`;
      card.innerHTML = `<summary><span class="glyph">${GLYPHS[e.tool] || "◦"}</span>${head}<span class="tstat">…</span><span class="chev">⌄</span></summary><div class="tbody">${body}</div>`;
      currentToolBox().appendChild(card);
    } else if (e.kind === "tool_result") {
      const card = lastPendingCard();
      if (!card) continue;
      const stat = card.querySelector(".tstat");
      if (stat) stat.outerHTML = e.ok ? '<span class="st-ok">✓</span>' : '<span class="st-err">✗</span>';
      const body = card.querySelector(".tbody");
      // file-op cards already show the diff; only add noise when it failed
      if (body && !(e.ok && FILE_VERBS[e.tool])) {
        const detail = e.ok ? (e.output || "(done)") : (e.error || "error");
        body.insertAdjacentHTML("beforeend", `<div class="sect">${e.ok ? "result" : "error"}</div>${esc(detail)}`);
      }
    }
  }
}

/* live streamed text */
function setPartial(text) {
  let live = $("#live-msg");
  if (!text) { if (live) live.remove(); return; }
  if (!live) {
    $("#lane").insertAdjacentHTML("beforeend",
      `<div class="m m-forge" id="live-msg"><div class="tag">${LOGO}Forge</div><div class="body"></div></div>`);
    live = $("#live-msg");
  }
  live.querySelector(".body").innerHTML = renderReply(text) + '<span class="cursor"></span>';
}

/* ── scrolling ───────────────────────────────────────────────
   Follow new output only while the reader is already at the bottom.
   Scrolling up to read something must never be undone by the next poll. */
const _PIN_SLACK_PX = 120;
function atBottom() {
  const t = $("#thread");
  return t.scrollHeight - t.scrollTop - t.clientHeight < _PIN_SLACK_PX;
}
let _lastAutoTop = -1;
function keepPinned() {
  const t = $("#thread");
  // Don't rely on scroll events alone — they are not guaranteed for every
  // programmatic move. If the position drifted from where we last put it and
  // we're no longer near the bottom, the reader moved it: stop following.
  if (S.pinned && _lastAutoTop >= 0 && Math.abs(t.scrollTop - _lastAutoTop) > 2
      && !atBottom()) {
    S.pinned = false;
  }
  if (S.pinned) {
    t.scrollTop = t.scrollHeight;
    _lastAutoTop = t.scrollTop;
  }
  $("#jump").classList.toggle("on", !S.pinned);
}
function jumpToLatest() {
  S.pinned = true;
  const t = $("#thread");
  t.scrollTo({ top: t.scrollHeight, behavior: "smooth" });  // deliberate, so animate
  _lastAutoTop = -1;  // re-baseline after the animation settles
  $("#jump").classList.remove("on");
}

/* ── polling ─────────────────────────────────────────────── */
async function poll(gen, fast) {
  if (!S.active || gen !== S.pollGen) return;
  clearTimeout(S.timer);
  try {
    const st = await api(`/chat/updates?events_after=${S.evtSeen}&messages_after=${S.msgSeen}`);
    const wasWorking = S.status === "working";
    S.status = st.status;
    if (st.status === "working" && !wasWorking) S.workStart = Date.now();

    const toolEvents = st.events.filter(e =>
      e.kind === "tool_call" || e.kind === "tool_result" ||
      e.kind === "intent_brief" || e.kind === "honesty_violation" ||
      e.kind === "plan_first" || e.kind === "focused_pass");
    if (toolEvents.length) { setPartial(""); addToolEvents(toolEvents); }
    S.evtSeen = st.event_count;

    if (st.messages.length) setPartial("");
    for (const m of st.messages) m.role === "user" ? addUser(m.text) : addForge(m.text, m.kind);
    S.msgSeen = st.message_count;

    if (st.status === "working" && st.partial) setPartial(st.partial);
    if (st.status !== "working") setPartial("");

    const w = $("#working");
    if (!w) {
      $("#lane").insertAdjacentHTML("beforeend",
        `<div id="working"><div class="flame">${LOGO}</div><span id="work-label"></span><span id="queued-note"></span></div>`);
    }
    $("#working").classList.toggle("on", st.status === "working");
    if (st.status === "working") {
      $("#lane").appendChild($("#working"));
      $("#work-label").textContent = `Working… ${Math.max(0, Math.round((Date.now() - S.workStart)/1000))}s`;
      $("#queued-note").textContent = st.queued ? ` · ${st.queued} queued` : "";
    }

    $("#send").disabled = st.status === "working";
    $("#stop").classList.toggle("on", st.status === "working");
    if (st.pending_approval) { $("#ap-tool").textContent = st.pending_approval.tool; $("#ap-detail").textContent = st.pending_approval.detail; $("#ap-veil").classList.add("on"); }
    else $("#ap-veil").classList.remove("on");

    if (st.effort) syncEffortUI(st.effort);
    if (st.mode) updateModeUI(st.mode);
    $("#u-model").textContent = st.model;
    $("#u-in").textContent = st.usage.prompt_tokens.toLocaleString();
    $("#u-out").textContent = st.usage.completion_tokens.toLocaleString();
    $("#u-changed").textContent = st.changed_files.length ? `${st.changed_files.length} file(s) changed` : "";

    if (st.messages.length || toolEvents.length || st.partial) keepPinned();
    if (st.status === "working" || wasWorking) refreshSessions();
  } catch (e) { /* transient — keep polling */ }
  S.timer = setTimeout(() => poll(gen), S.status === "working" || fast ? 450 : 2500);
}

/* ── approvals / diff / undo ─────────────────────────────── */
async function answerApproval(approved, always) {
  $("#ap-veil").classList.remove("on");
  try { await api("/chat/approval", { approved, always }); } catch (e) {}
  poll(S.pollGen, true);
}
async function showDiff() {
  const d = await api("/chat/diff");
  const st = await api("/chat/updates?events_after=999999&messages_after=999999");
  $("#diff-files").textContent = st.changed_files.join("  ·  ");
  $("#diff-body").innerHTML = (d.diff || "No changes in this session yet.").split("\n").map(l => {
    const cls = /^(\+\+\+|---|@@)/.test(l) ? "dm" : l.startsWith("+") ? "da" : l.startsWith("-") ? "dd" : "";
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
  $("#diff-veil").classList.add("on");
}
async function undoAll() {
  if (!confirm("Revert every file change made in this session?")) return;
  const r = await api("/chat/undo", {});
  addForge(r.restored.length ? "Reverted: " + r.restored.join(", ") : "Nothing to undo.", "command");
}

/* ── top bar controls ────────────────────────────────────── */
$("#h-model").addEventListener("change", async () => {
  try { await api("/chat/model", { model: $("#h-model").value }); refreshSessions(); } catch (e) {}
});

/* ── composer ergonomics ─────────────────────────────────── */
const input = $("#input");
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 190) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("#thread").addEventListener("scroll", () => {
  S.pinned = atBottom();
  $("#jump").classList.toggle("on", !S.pinned);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.status === "working") { stopTurn(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && S.active) {
    e.preventDefault(); newChat();
  }
});

/* ── boot ────────────────────────────────────────────────── */
(async () => {
  await loadModels("w-model");
  await loadRecent();
  try { const h = await api("/health"); if (!$("#w-folder").value) $("#w-folder").value = h.workspace; } catch (e) {}
  // reattach to a live session after a reload (e.g. the window was refreshed)
  try {
    const st = await api("/chat/updates?events_after=999999&messages_after=999999");
    enterChat(st);
  } catch (e) { /* no active session — stay on welcome */ }
})();
</script>
