<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — autonomous engineer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #2d333c;
    --text: #e6edf3; --dim: #8b949e; --accent: #e8833a; --accent2: #f0a35e;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --info: #58a6ff;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; letter-spacing: 3px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  #workspace { color: var(--dim); font-family: var(--mono); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #health { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  .dot.ok { background: var(--ok); }

  main { flex: 1; display: grid; grid-template-columns: 330px 1fr; min-height: 0; }

  aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #newrun { padding: 14px; border-bottom: 1px solid var(--border); }
  #newrun textarea { width: 100%; height: 74px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: var(--sans); font-size: 13px; resize: vertical; }
  #newrun input { width: 100%; margin-top: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; font-family: var(--mono); font-size: 12px; }
  #newrun button { margin-top: 10px; width: 100%; padding: 9px; background: var(--accent); color: #131313; font-weight: 700; border: 0; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #newrun button:disabled { opacity: .45; cursor: default; }
  #runs { flex: 1; overflow-y: auto; }
  .run-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .run-item:hover, .run-item.active { background: var(--panel2); }
  .run-item .task { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .meta { display: flex; gap: 8px; margin-top: 5px; font-size: 11px; color: var(--dim); font-family: var(--mono); }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .chip.running { background: #1f3a5f; color: var(--info); }
  .chip.success { background: #1d3524; color: var(--ok); }
  .chip.partial { background: #3a2f16; color: var(--warn); }
  .chip.failed, .chip.rejected { background: #46211f; color: var(--err); }
  .chip.approved { background: #1d3524; color: var(--ok); }

  #content { display: flex; flex-direction: column; min-height: 0; }
  nav { display: flex; gap: 2px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 10px 14px; cursor: pointer; font-size: 13px; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab { flex: 1; overflow-y: auto; padding: 16px; display: none; min-height: 0; }
  .tab.active { display: block; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-bottom: 10px; }
  pre { font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .placeholder { color: var(--dim); padding: 40px; text-align: center; }

  #events { max-height: 320px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
  #events .agent { color: var(--accent2); }
  #events .kind { color: var(--info); }
  #events .err { color: var(--err); }

  .diff-line { display: block; padding: 0 6px; }
  .diff-add { background: #12261e; color: #7ee2a8; }
  .diff-del { background: #2d1a1c; color: #ff9d94; }
  .diff-hunk { color: var(--info); }
  .diff-file { color: var(--accent2); font-weight: 700; }

  .task-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .task-row:last-child { border-bottom: 0; }
  .task-row .issues { margin: 6px 0 0 16px; color: var(--warn); font-size: 12.5px; }
  .stats { display: flex; gap: 22px; font-family: var(--mono); font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .stats b { color: var(--text); font-size: 15px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
</style>
</head>
<body>
<header>
  <h1>FORGE<span>▮</span></h1>
  <div id="workspace"></div>
  <div id="health"><span class="dot" id="hdot"></span><span id="htext">checking…</span></div>
</header>
<main>
  <aside>
    <div id="newrun">
      <textarea id="task" placeholder="Describe the engineering task…"></textarea>
      <input id="check" placeholder="check command (optional), e.g. pytest -q">
      <button id="go" onclick="submitRun()">Run autonomous task</button>
    </div>
    <div id="runs"></div>
  </aside>
  <div id="content">
    <nav>
      <button class="active" onclick="showTab('run', this)">Run</button>
      <button onclick="showTab('repo', this)">Repository</button>
      <button onclick="showTab('memory', this)">Memory</button>
    </nav>
    <section id="tab-run" class="tab active"><div class="placeholder">Submit a task or select a run.</div></section>
    <section id="tab-repo" class="tab"><div class="placeholder">Loading…</div></section>
    <section id="tab-memory" class="tab"><div class="placeholder">Loading…</div></section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => (t ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let selected = null;

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function refreshHealth() {
  try {
    const h = await api("/health");
    $("#workspace").textContent = h.workspace;
    const ok = h.ollama_reachable && h.model_available;
    $("#hdot").className = "dot" + (ok ? " ok" : "");
    $("#htext").textContent = ok ? h.model : (h.ollama_reachable ? h.model + " missing" : "ollama offline");
  } catch { $("#hdot").className = "dot"; $("#htext").textContent = "api offline"; }
}

async function refreshRuns() {
  const runs = await api("/runs");
  $("#runs").innerHTML = runs.map(r => `
    <div class="run-item ${r.id === selected ? "active" : ""}" onclick="selectRun('${r.id}')">
      <div class="task">${esc(r.task)}</div>
      <div class="meta"><span class="chip ${r.status}">${r.status}</span><span>${r.id}</span><span>${(r.started_at || "").slice(11, 19)}</span></div>
    </div>`).join("");
}

async function submitRun() {
  const request = $("#task").value.trim();
  if (request.length < 3) return;
  $("#go").disabled = true;
  try {
    const check = $("#check").value.trim();
    const body = { request, check_commands: check ? [check] : [] };
    const { run_id } = await api("/runs", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    $("#task").value = "";
    await refreshRuns();
    selectRun(run_id);
  } finally { $("#go").disabled = false; }
}

async function selectRun(id) {
  selected = id;
  showTab("run", document.querySelector("nav button"));
  await renderRun();
  await refreshRuns();
}

function diffHtml(diff) {
  return diff.split("\n").map(l => {
    let cls = "";
    if (l.startsWith("+++") || l.startsWith("---")) cls = "diff-file";
    else if (l.startsWith("@@")) cls = "diff-hunk";
    else if (l.startsWith("+")) cls = "diff-add";
    else if (l.startsWith("-")) cls = "diff-del";
    return `<span class="diff-line ${cls}">${esc(l) || " "}</span>`;
  }).join("");
}

async function renderRun() {
  if (!selected) return;
  const d = await api("/runs/" + selected);
  const events = await api(`/runs/${selected}/events`);
  const r = d.report;
  const running = d.status === "running";
  const tasks = (r && r.task_results || []).map(t => `
    <div class="task-row">
      <span class="chip ${t.status}">${t.status}</span>
      <b>task ${t.task_id}: ${esc(t.title)}</b>
      <span style="color:var(--dim)"> — ${t.attempts} attempt(s)</span>
      ${t.review && t.review.summary ? `<div style="color:var(--dim);font-size:12.5px;margin-top:4px">${esc(t.review.summary)}</div>` : ""}
      ${t.review && t.review.issues.length ? `<ul class="issues">${t.review.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
  const eventsHtml = events.map(e => {
    const p = e.payload || {};
    let detail = p.tool ? `${p.tool} ${esc(JSON.stringify(p.arguments || p.ok || "")).slice(0, 110)}` : esc(p.message || p.summary || "");
    if (e.kind === "tool_result" && p.ok === false) detail = `<span class="err">${esc(p.error || "error")}</span>`;
    return `<div><span class="agent">${e.agent}</span> <span class="kind">${e.kind}</span> ${detail}</div>`;
  }).join("");
  $("#tab-run").innerHTML = `
    <div class="card"><div style="display:flex;align-items:center;gap:12px">
      <span class="chip ${d.status}">${d.status}</span>
      <b style="flex:1">${esc(d.task)}</b>
      <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${d.id}</span>
    </div>
    ${r && r.plan_summary ? `<p style="margin-top:10px;color:var(--dim)">${esc(r.plan_summary)}</p>` : ""}
    ${r && r.error ? `<p style="margin-top:10px;color:var(--err)">${esc(r.error)}</p>` : ""}</div>
    ${r ? `<div class="card"><h3>Metrics</h3><div class="stats">
      <span><b>${r.duration_s ?? "…"}s</b>duration</span>
      <span><b>${r.usage ? r.usage.prompt_tokens : 0}</b>tokens in</span>
      <span><b>${r.usage ? r.usage.completion_tokens : 0}</b>tokens out</span>
      <span><b>${(r.changed_files || []).length}</b>files changed</span></div></div>` : ""}
    ${tasks ? `<div class="card"><h3>Tasks</h3>${tasks}</div>` : ""}
    <div class="card"><h3>Event trace ${running ? "· live" : ""}</h3><div id="events">${eventsHtml || '<span style="color:var(--dim)">no events yet</span>'}</div></div>
    ${r && r.diff ? `<div class="card"><h3>Diff (originals in .forge/backups/)</h3><pre>${diffHtml(r.diff)}</pre></div>` : ""}`;
  const feed = $("#events");
  if (feed) feed.scrollTop = feed.scrollHeight;
}

async function renderRepo() {
  const repo = await api("/repo");
  const stats = Object.entries(repo.language_stats).sort((a, b) => b[1] - a[1])
    .map(([lang, lines]) => `<span><b>${lines.toLocaleString()}</b>${esc(lang)}</span>`).join("");
  $("#tab-repo").innerHTML = `
    <div class="card"><h3>Languages · ${repo.files} files</h3><div class="stats">${stats || "none"}</div></div>
    <div class="card"><h3>File tree</h3><pre>${esc(repo.tree)}</pre></div>`;
}

async function renderMemory() {
  const lessons = await api("/memory");
  if (!lessons.length) { $("#tab-memory").innerHTML = '<div class="placeholder">No lessons recorded yet.</div>'; return; }
  $("#tab-memory").innerHTML = `<div class="card"><h3>Lessons learned</h3><table>
    <tr><th>when</th><th>task</th><th>status</th><th>issues</th></tr>
    ${lessons.map(l => `<tr><td style="font-family:var(--mono)">${(l.ts || "").slice(0, 19).replace("T", " ")}</td>
      <td>${esc(l.task_title)}</td><td><span class="chip ${l.status}">${l.status}</span></td>
      <td>${l.issues.map(esc).join("<br>") || "—"}</td></tr>`).join("")}</table></div>`;
}

function showTab(name, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  $("#tab-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "repo") renderRepo();
  if (name === "memory") renderMemory();
}

refreshHealth(); refreshRuns();
setInterval(refreshHealth, 10000);
setInterval(refreshRuns, 3000);
setInterval(() => { if (selected && $("#tab-run").classList.contains("active")) renderRun(); }, 2000);
</script>
</body>
</html>
