[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-engineer"
version = "0.1.0"
description = "Forge — a local autonomous AI software engineer (Claude Code-like, powered by Ollama)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Project Forge" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
forge = "forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's idiom requires function calls in argument defaults and Optional[...]
"src/forge/cli.py" = ["B008", "UP045", "UP007"]

[tool.coverage.run]
source = ["src/forge"]
omit = ["src/forge/cli.py"]
